plugins { id 'com.android.application' }
android {
    namespace 'ir.promptexa.webviewbook'
    compileSdk 35
    defaultConfig {
        applicationId "ir.promptexa.webviewbook"   // CHANGE to your own unique id before publishing
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) { signingConfig signingConfigs.release }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // Fixes 'Duplicate class kotlin.*' (aligns all Kotlin stdlib artifacts to one version)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
